# Render Blueprint: New → Blueprint → pick this repo → Apply. Creates two services:
#  - trustline       real mode: reads real accounts. Provider keys are set in the service's Environment page (docs/CONNECTORS.md).
#  - trustline-demo  demo mode: synthetic stand-ins for every outside service, no provider keys needed.
# On the free plan both sleep when idle and start with an empty database after a restart.
services:
  - type: web
    name: trustline
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /beta
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Claude for email reading and the officer's explanation. Provider keys go in the Environment page later.
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: trustline-demo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /beta
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_MODE
        value: "1"
      - key: TRUSTLINE_DB_PATH
        value: data/demo.db
      # Optional: with a key, Claude writes the officer's explanation and reads payment emails.
      - key: ANTHROPIC_API_KEY
        sync: false
